name: integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The components move on their own main branches, so run daily as well.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/clone
      # Each component's own pins, so the test builds them as their own CI does.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: backend/mise.toml
          version-type: strict
      - run: rustup toolchain install
        working-directory: cli
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/deps
            backend/_build
          key: smoke-${{ runner.os }}-${{ hashFiles('backend/mise.toml') }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: smoke-${{ runner.os }}-${{ hashFiles('backend/mise.toml') }}-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - run: tests/integration/smoke.sh
